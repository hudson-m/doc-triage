name: CD

# Build once, promote the same image (ADR 9, ADR 10):
# - push to staging (a merged feature): run the CI gates, build the image, deploy to staging.
# - push to main (a release from staging): run the CI gates, then promote the image staging
#   already tested. The release merge commit has a new SHA but the same source tree, so the
#   image is found by its `tree-<hash>` tag and nothing is rebuilt.
# - push to main from a hotfix: the tree is new, so the image is built and deployed.
# Environments are registry tags here; a host would deploy the promoted digest.

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

# One deploy per branch at a time, never cancelled half-way.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Resolve or publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for an image built from the same source tree
        id: existing
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          if digest="$(docker buildx imagetools inspect "${IMAGE}:tree-${tree}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "::notice::Reusing the image built from tree ${tree}: ${digest}"
          else
            echo "No image for tree ${tree} yet; building one."
          fi
      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:tree-${{ steps.existing.outputs.tree }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Supply chain metadata attached to the image: how it was built, and what is in it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image to deploy
        id: result
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING:-$BUILT}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image for ${DEPLOY_ENV}: \`${IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: image
    runs-on: ubuntu-latest
    # Each environment accepts its own branch only; production adds required reviewers.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the image
        run: |
          docker pull "${IMAGE}@${REF}"
          scripts/smoke-test.sh "${IMAGE}@${REF}"
      # Re-points the environment's tag at the existing manifest: nothing is rebuilt.
      - name: Promote
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${DEPLOY_ENV}" "${IMAGE}@${REF}"
          echo "${DEPLOY_ENV} now runs \`${IMAGE}@${REF}\`" >> "$GITHUB_STEP_SUMMARY"
