name: CD

# Build once, promote the same image: every push to main runs the full CI gate, publishes one
# image to GHCR, and promotes that exact digest to staging and then (after approval) production.
# Environments here are tags on the registry; a host would deploy the promoted digest (ADR 9).

on:
  push:
    branches: [main]

permissions:
  contents: read

# Deploys run one at a time and are never cancelled half-way.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Supply chain metadata attached to the image: how it was built, and what is in it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: echo "Published \`${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the published image
        run: |
          docker pull "${IMAGE}@${REF}"
          scripts/smoke-test.sh "${IMAGE}@${REF}"
      # Re-points the tag at the existing manifest: nothing is rebuilt.
      - name: Promote to staging
        run: docker buildx imagetools create --tag "${IMAGE}:staging" "${IMAGE}@${REF}"

  production:
    name: Deploy to production
    needs: [publish, staging]
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until someone approves.
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the published image
        run: |
          docker pull "${IMAGE}@${REF}"
          scripts/smoke-test.sh "${IMAGE}@${REF}"
      - name: Promote to production
        run: docker buildx imagetools create --tag "${IMAGE}:production" "${IMAGE}@${REF}"
      - name: Summary
        run: echo "Production now runs \`${IMAGE}@${REF}\`" >> "$GITHUB_STEP_SUMMARY"
