name: CD

# Build once, promote the same image (ADR 9, ADR 10):
# - push to staging (a merged feature): run the CI gates, build the image, deploy to staging.
# - push to main (a release from staging): run the CI gates, then promote the image staging
#   already tested. The release merge commit has a new SHA but the same source tree, so the
#   image is found by its `staged-tree-<hash>` tag, which staging adds only after its smoke
#   test, deploy and endpoint checks pass. Nothing is rebuilt.
# - push to main from a hotfix: the tree is new, so the image is built and deployed.
# Environments are registry tags here; a host would deploy the promoted digest.

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

# One deploy per branch at a time, never cancelled half-way.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Resolve or publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read # to identify the PR behind a commit on main
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      tree: ${{ steps.existing.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # staging reuses any image built from this tree; main accepts only one that passed staging.
      - name: Look for an image for the same source tree
        id: existing
        env:
          TAG_PREFIX: ${{ github.ref_name == 'main' && 'staged-tree' || 'tree' }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          if digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG_PREFIX}-${tree}" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "::notice::Reusing ${TAG_PREFIX}-${tree}: ${digest}"
          else
            echo "No image tagged ${TAG_PREFIX}-${tree}."
          fi
      # On main, a missing staging image must stop a normal release instead of being rebuilt:
      # production only runs what staging tested. Only a labelled hotfix may build on main.
      - name: Allow a build on main only for a labelled hotfix
        if: github.ref_name == 'main' && steps.existing.outputs.digest == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr="$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" \
            --jq '.[0] // {} | {ref: (.head.ref // ""), hotfix: ([.labels[]?.name] | index("hotfix") != null)}')"
          head_ref="$(jq -r .ref <<<"$pr")"
          has_label="$(jq -r .hotfix <<<"$pr")"
          if [[ "$head_ref" == hotfix/* && "$has_label" == "true" ]]; then
            echo "::notice::Hotfix ${head_ref}: building the image from main."
          else
            echo "::error::No image for this tree passed staging, and this is not a labelled hotfix (head '${head_ref}'). Release from staging instead of rebuilding on main."
            exit 1
          fi
      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:tree-${{ steps.existing.outputs.tree }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Supply chain metadata attached to the image: how it was built, and what is in it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image to deploy
        id: result
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING:-$BUILT}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image for ${DEPLOY_ENV}: \`${IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: image
    runs-on: ubuntu-latest
    # Each environment accepts its own branch only; production adds required reviewers.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.azure.outputs.url }}
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for Azure; no stored cloud credential (ADR 11)
    env:
      REF: ${{ needs.image.outputs.digest }}
      TREE: ${{ needs.image.outputs.tree }}
      RESOURCE_GROUP: rg-doc-triage-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CONTAINER_APP: ca-doc-triage-${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the image
        run: |
          docker pull "${IMAGE}@${REF}"
          scripts/smoke-test.sh "${IMAGE}@${REF}"
      # Azure steps run once infra/azure/bootstrap.sh has run and the environment variables
      # exist; until then CD stops at the registry, as before.
      - name: Sign in to Azure (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the digest to Azure Container Apps
        id: azure
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          # The bootstrap placeholder listens on 80; the app listens on 3000.
          az containerapp ingress update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --target-port 3000 --output none
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE}@${REF}" --output none
          fqdn="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"
      # The app scales to zero, so the first request may wait for a cold start.
      - name: Check the deployed endpoints
        if: vars.AZURE_CLIENT_ID != ''
        env:
          URL: ${{ steps.azure.outputs.url }}
        run: scripts/check-endpoints.sh "$URL" 120
      # Re-points the environment's tag at the existing manifest: nothing is rebuilt.
      - name: Promote
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${DEPLOY_ENV}" "${IMAGE}@${REF}"
          echo "${DEPLOY_ENV} now runs \`${IMAGE}@${REF}\`" >> "$GITHUB_STEP_SUMMARY"
      # Only now, after every staging check passed, may a release to main promote this image.
      - name: Record that this image passed staging
        if: github.ref_name == 'staging'
        run: docker buildx imagetools create --tag "${IMAGE}:staged-tree-${TREE}" "${IMAGE}@${REF}"
