name: CI

on:
  pull_request:
  # main is not built here: cd.yml calls this workflow on every push to main, so the merge
  # commit passes the same gates before an image is published.
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels the old run; runs on main (via CD) are never cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tag in the comment): a moved tag cannot change what runs.
# Dependabot updates both. Checkouts don't persist the GitHub token for later steps.

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      # Pinned here so a tampered release asset fails the job instead of running.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest tree
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --tlsv1.2 -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      # Scans the whole git history: a key deleted in a later commit is still leaked.
      - name: Scan git history
        run: ./gitleaks git . --redact --verbose --exit-code 1

  quality:
    name: Lint, types, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: SonarQube uses it for new-code detection and blame
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format
        run: npm run format:check
      # Includes the package-boundary rules in eslint.config.mjs
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests, with coverage
        run: npm run test:coverage
      # The rules are deterministic: any misclassification by them fails the build.
      - name: Evaluation gate (offline, fake LLM)
        run: npm run eval -- --min-rules-accuracy 1
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # The token is scoped to the steps that need it, never to the whole job: other steps run
      # third-party code. Forks and Dependabot PRs have no secrets, so skip there.
      # SonarQube Cloud's free plan analyses pull requests and main only, not other branches.
      - name: Check for SonarQube Cloud token
        id: sonar
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is not set; SonarQube Cloud analysis skipped."
          fi
      - name: SonarQube Cloud analysis and quality gate
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run e2e:install
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: doc-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: scripts/smoke-test.sh doc-triage:ci

  ci-passed:
    name: ci-passed
    if: always()
    needs: [secrets, quality, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
