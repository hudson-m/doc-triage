name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, eval
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: SonarQube uses it for new-code detection and blame
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      # Includes the package-boundary rules in eslint.config.mjs
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests, with coverage
        run: npm run test:coverage
      # The rules are deterministic: any misclassification by them fails the build.
      - name: Evaluation gate (offline, fake LLM)
        run: npm run eval -- --min-rules-accuracy 1
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # Secrets are not available to forks and Dependabot PRs: skip instead of failing.
      - name: SonarQube Cloud analysis and quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
      - name: SonarQube Cloud skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; SonarQube Cloud analysis skipped."

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: doc-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 3000:3000 doc-triage:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs -X POST localhost:3000/api/classify -H 'content-type: application/json' \
            -d '{"text":"Form W-2 Wage and Tax Statement. Social security wages 1,000."}' | grep '"route":"rules"'
          curl -fs localhost:3000/ | grep -q '<div id="root">'

  ci-passed:
    name: ci-passed
    if: always()
    needs: [quality, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
