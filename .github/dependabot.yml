version: 2
# Updates go to staging like any other change, and reach main with the next release (ADR 10).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. See ADR 2.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
