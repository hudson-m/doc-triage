# SonarQube Cloud. The organization and project keys are the defaults SonarQube Cloud
# suggests when it imports hudson-m/doc-triage from GitHub.
sonar.organization=hudson-m
sonar.projectKey=hudson-m_doc-triage
sonar.projectName=doc-triage

sonar.sources=packages/core/src,apps/api/src,apps/web/src
sonar.tests=packages/core/test,apps/api/test,apps/web/test,e2e
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Same exclusions as vitest.config.ts: entry points covered by the E2E tests instead.
sonar.coverage.exclusions=apps/api/src/server.ts,apps/api/src/eval.ts,apps/web/src/main.tsx

# Fail the CI step when the quality gate fails, so a red gate blocks the merge.
sonar.qualitygate.wait=true
