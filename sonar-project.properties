# SonarQube Cloud. The organization and project keys are the defaults SonarQube Cloud
# suggests when it imports hudson-m/doc-triage from GitHub.
sonar.organization=hudson-m
sonar.projectKey=hudson-m_doc-triage
sonar.projectName=doc-triage

# SonarQube Cloud analyses the whole repository (sonar.sources/sonar.tests are ignored), so
# scope is set with exclusions. Generated output and synthetic data are not code.
sonar.exclusions=coverage/**,**/dist/**,playwright-report/**,test-results/**,dataset/**

# Coverage counts application code only, matching vitest.config.ts: tests, configuration
# files and entry points (exercised by the E2E tests instead) are excluded.
sonar.coverage.exclusions=**/test/**,e2e/**,**/*.config.ts,**/*.config.mjs,apps/api/src/server.ts,apps/api/src/eval.ts,apps/web/src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fail the CI step when the quality gate fails, so a red gate blocks the merge.
sonar.qualitygate.wait=true
